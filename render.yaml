services:
  - type: web
    name: finance-backend-api
    env: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: DISABLE_SSL_VERIFY
        value: "false"
      - key: FRED_API_KEY
        sync: false
      - key: ARX_API_KEY
        sync: false
      - key: EODHD_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false

