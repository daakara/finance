services:
  - type: web
    name: finance-backend-api
    env: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DISABLE_SSL_VERIFY
        value: "false"
      - key: FRED_API_KEY
        value: 70089dccee2c5a687260428851534996

