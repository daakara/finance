[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-analysis-platform"
version = "1.0.0"
description = "Professional-grade financial market analysis platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.18",
    "alpha-vantage>=2.3.1",
    "ccxt>=4.0.0",
    "requests>=2.31.0",
    "streamlit>=1.28.0",
    "plotly>=5.15.0",
    "ta>=0.10.2",
    "TA-Lib>=0.4.26",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "certifi>=2023.7.22"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

