    svg { width: 100vw; height: 100vh; cursor: grab; }
    svg:active { cursor: grabbing; }
    .link { stroke: #1e293b; stroke-opacity: 0.6; stroke-width: 1.2px; }
    .link.highlight { stroke: #38bdf8; stroke-opacity: 1; stroke-width: 2.2px; }
    .node circle { stroke-width: 2px; cursor: pointer; }
    .node text { font-size: 10px; fill: #cbd5e1; pointer-events: none; }

 "IMPORTS"}, {"source": "frontend/lib/marketDatabase.ts", "target": "frontend/lib/api.ts", "type": "IMPORTS"}, {"source": "frontend/lib/marketDatabase.ts", "target": "frontend/lib/constants.ts", "type": "IMPORTS"}, {"source": "tests/test_config_security.py", "target": "tests/test_phase1_config.py", "type": "IMPORTS"}, {"source": "tests/test_confluence_engine.py", "target": "analyst_dashboard/analyzers/confluence_engine.py", "type": "IMPORTS"}, {"source": "tests/test_cross_component_state_synchronicity.py", "target": "tests/test_nextjs_frontend_structure.py", "type": "IMPORTS"}, {"source": "tests/test_eodhd_fetcher.py", "target": "analyst_dashboard/data/eodhd_fetcher.py", "type": "IMPORTS"}, {"source": "tests/test_financial_domain_invariants.py", "target": "analyst_dashboard/analyzers/gem_screener.py", "type": "IMPORTS"}, {"source": "tests/test_financial_domain_invariants.py", "target": "analyst_dashboard/analyzers/optimal_execution.py", "type": "IMPORTS"}, {"source": "tests/test_gem_screener.py", "target": "analyst_dashboard/analyzers/gem_screener.py", "type": "IMPORTS"}, {"source": "tests/test_hidden_gems_expert_engine.py", "target": "api/routes/screener.py", "type": "IMPORTS"}, {"source": "tests/test_hidden_gems_expert_engine.py", "target": "analyst_dashboard/analyzers/gem_screener.py", "type": "IMPORTS"}, {"source": "tests/test_market_db.py", "target": "analyst_dashboard/data/market_db.py", "type": "IMPORTS"}, {"source": "tests/test_optimal_execution.py", "target": "analyst_dashboard/analyzers/optimal_execution.py", "type": "IMPORTS"}, {"source": "tests/test_screener_execution.py", "target": "api/routes/screener.py", "type": "IMPORTS"}, {"source": "tests/test_screener_execution.py", "target": "analyst_dashboard/analyzers/optimal_execution.py", "type": "IMPORTS"}, {"source": "frontend/lib/api.ts", "target": "api/main.py", "type": "HTTP_REST_API"}]};

    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = d3.select("#canvas").attr("viewBox", [0, 0, width, height]);
    const g = svg.append("g");

    const zoom = d3.zoom().scaleExtent([0.1, 4]).on("zoom", (e) => g.attr("transform", e.transform));
    svg.call(zoom);

    const layerColors = {
      "Backend: API Route": "#f43f5e",
      "Backend: API Core": "#fb7185",
      "Backend: Quant Engine": "#a855f7",
      "Backend: Data Layer": "#ec4899",
      "Frontend: App Page": "#38bdf8",
      "Frontend: App Layout": "#0284c7",
      "Frontend: UI Component": "#10b981",
      "Frontend: State & Bus": "#f59e0b",
      "Frontend: Utility & SSOT": "#64748b",
      "Test Suite": "#6366f1"
    };

    const simulation = d3.forceSimulation(graphData.nodes)
      .force("link", d3.forceLink(graphData.edges).id(d => d.id).distance(60))
      .force("charge", d3.forceManyBody().strength(-100))
      .force("center", d3.forceCenter(width / 2, height / 2))
      .force("collide", d3.forceCollide().radius(d => Math.max(8, Math.min(22, 6 + (d.inDegree || 0) * 1.5))));

    const link = g.append("g")
      .selectAll("line")
      .data(graphData.edges)
      .join("line")
      .attr("class", "link");

    const node = g.append("g")
      .selectAll(".node")
      .data(graphData.nodes)
      .join("g")
      .attr("class", "node")
      .call(d3.drag()
        .on("start", (e, d) => {
          if (!e.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x; d.fy = d.y;
        })
        .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on("end", (e, d) => {
          if (!e.active) simulation.alphaTarget(0);
          d.fx = null; d.fy = null;
        }));

    node.append("circle")
      .attr("r", d => Math.max(5, Math.min(18, 5 + (d.inDegree || 0) * 1.4)))
      .attr("fill", d => layerColors[d.type] || "#475569")
      .attr("stroke", d => d3.rgb(layerColors[d.type] || "#475569").brighter(0.8));

    node.append("text")
      .attr("x", 8).attr("y", 3).text(d => d.label);

    node.on("click", (e, d) => { highlightNode(d); showInfo(d); });

    svg.on("click", (e) => {
      if (e.target.tagName === 'svg') {
        resetHighlight();
        document.getElementById("info-panel").style.display = 'none';
      }
    });

    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);
      node.attr("transform", d => `translate(${d.x},${d.y})`);
    });

    function highlightNode(target) {
      const connected = new Set([target.id]);
      link.classed("highlight", d => {
        const isMatch = d.source.id === target.id || d.target.id === target.id;
        if (isMatch) { connected.add(d.source.id); connected.add(d.target.id); }
        return isMatch;
      });
      node.classed("highlight", d => connected.has(d.id));
      node.style("opacity", d => connected.has(d.id) ? 1 : 0.2);
      link.style("opacity", d => (d.source.id === target.id || d.target.id === target.id) ? 1 : 0.05);
    }

    function resetHighlight() {
      node.classed("highlight", false).style("opacity", 1);
      link.classed("highlight", false).style("opacity", 0.6);
    }

    function showInfo(d) {
      const panel = document.getElementById("info-panel");
      document.getElementById("node-title").innerText = d.label;
      document.getElementById("node-type").innerText = d.type;
      document.getElementById("node-path").innerText = d.path;
      document.getElementById("node-in").innerText = d.inDegree || 0;
      document.getElementById("node-out").innerText = d.outDegree || 0;
      document.getElementById("node-lines").innerText = d.lines || 0;
      panel.style.display = 'block';
    }

    function searchNodes(query) {
      if (!query.trim()) { resetHighlight(); return; }
      const q = query.toLowerCase();
      const matches = graphData.nodes.filter(n => n.label.toLowerCase().includes(q) || n.path.toLowerCase().includes(q));
      if (matches.length > 0) { highlightNode(matches[0]); showInfo(matches[0]); }
    }
  </script>
