name: Smart Money Evidence Truth Regression

on:
  pull_request:
    branches: [release/production]
    paths:
      - "analyst_dashboard/analyzers/smart_money.py"
      - "analyst_dashboard/analyzers/evidence_timestamp_projection.py"
      - "tests/test_sm_act_027_advisory_truth.py"
      - "tests/test_sm_act_027_sqlite_projection.py"
      - "tests/test_sm_act_027_postgres_projection.py"
      - ".github/workflows/smart-money-evidence-truth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisory_truth:
    name: SM-ACT-027 Focused Evidence Regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sm_act_027
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: sm_act_027
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sm_act_027 -d sm_act_027"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SM_ACT_027_POSTGRES_TEST_DSN: "postgresql://sm_act_027:isolated_ci_only@localhost:5432/sm_act_027"
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest psycopg2-binary
      - name: Syntax-check advisory engine and test
        run: python -m py_compile analyst_dashboard/analyzers/smart_money.py analyst_dashboard/analyzers/evidence_timestamp_projection.py tests/test_sm_act_027_advisory_truth.py tests/test_sm_act_027_sqlite_projection.py tests/test_sm_act_027_postgres_projection.py
      - name: Run SM-ACT-027 source-contract regression
        run: python -m pytest tests/test_sm_act_027_advisory_truth.py tests/test_sm_act_027_sqlite_projection.py tests/test_sm_act_027_postgres_projection.py -q
