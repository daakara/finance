name: ARX Terminal CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-cov httpx starlette pyyaml pytest-asyncio pgserver psycopg2-binary jsonschema

    - name: Run Tier 1 Core Invariant Gate
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/ -m tier1 -v

    - name: Run Tier 2 Path-Filtered Gates (Temporary All-Run)
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/ -m "tier2a or tier2b or tier2c" -v

    - name: Run Focused Fundamentals & Research Invariant Gate
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/test_fundamentals_api.py tests/test_sourced_fundamentals_pilot.py tests/test_generate_opportunity_dossier_snapshot.py tests/test_prepare_opportunity_dossier.py -v

    - name: Verify Opportunity Dossier Snapshot Determinism
      env:
        PYTHONPATH: "."
      run: |
        python scripts/research/generate_opportunity_dossier_snapshot.py --check
        python scripts/research/prepare_opportunity_dossier.py --check

    - name: Run Historical SIP Ingestion & Registration Expansion Suite
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/test_bounded_150_candidate_expansion.py \
               tests/test_identity_adoption_dry_run.py \
               tests/test_identity_persistence.py \
               tests/test_three_candidate_registration_plan.py \
               tests/test_registration_execution_wrapper.py \
               tests/test_alpaca_historical_sip_ingestion.py \
               tests/test_market_db.py \
               tests/test_market_evidence_f13a.py -v

    - name: Run Sprint 2 Package B Recovery and Admission Safety Gate
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/test_pilot_identity_and_guarded_recovery.py \
               tests/test_universe_admission_mappings.py \
               tests/test_package_b_deployment_rehearsal.py -v

    - name: Run Sprint 2 Package C Canonical Contract & Governance Gate
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/test_package_b_v3_canonical_consumer.py \
               tests/test_strategy_governance_adversarial.py \
               tests/test_lookback_threshold_boundaries.py -v

    - name: VCP Research Conformance & Reproducibility
      env:
        PYTHONPATH: "."
      run: |
        python -m pytest \
          tests/test_vcp_candidate_005_conformance.py \
          tests/test_vcp_candidate_006_conformance.py \
          tests/test_vcp_candidate_reproducibility.py \
          -v --strict-markers

    - name: Smart Money & Hosted PostgreSQL 16 Integration Gate
      env:
        PYTHONPATH: "."
      run: |
        python scripts/run_postgres_integration_gate.py

    - name: Run Backlog Integrity Validator Suite (GOV-001)
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/test_backlog_integrity_validator.py -v

    - name: Governance Integration Gate (GOV-001)
      env:
        PYTHONPATH: "."
      run: |
        echo "============================================================"
        echo "GATE 1: GOVERNANCE INTEGRATION GATE"
        echo "Scope: Enforces Rules BI-000 to BI-012 on scoped changes against mainline"
        echo "Requirement: Mandatory PASS for PR merge eligibility"
        echo "============================================================"
        python tools/governance/validate_backlog_integrity.py --stage scoped --base-ref origin/main

    - name: Pre-Sprint 5 Certification Gate (GOV-001 Audit)
      id: pre_sprint5_closure_gate
      continue-on-error: true
      env:
        PYTHONPATH: "."
      run: |
        echo "============================================================"
        echo "GATE 2: PRE-SPRINT 5 CERTIFICATION GATE"
        echo "Scope: Enforces Invariants P5-001 to P5-012 for Sprint 5 execution kickoff"
        echo "Requirement: Expected to FAIL CLOSED until Product Owner kickoff authorization"
        echo "             and production deployment promotion are completed."
        echo "Note: Non-blocking for governance remediation PR merge."
        echo "============================================================"
        python tools/governance/validate_backlog_integrity.py --pre-sprint5-closure || {
          EXIT_CODE=$?
          echo "::notice title=Pre-Sprint 5 Gate Status::Pre-Sprint 5 Certification Gate correctly FAIL-CLOSED (exit code $EXIT_CODE). Sprint 5 kickoff remains blocked pending Product Owner authorization and production acceptance."
          exit $EXIT_CODE
        }

    - name: Run Tier 3 Pre-Flight Release Gate
      if: github.base_ref == 'main' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/ -m tier3 -v

  lint_and_security:
    name: Code Quality & Security Linter
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install linting & security tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 bandit

    - name: Enforce Syntax & Critical AST Checks
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Bandit Security Analysis
      run: |
        bandit -r api/ analyst_dashboard/ -ll -s B101 -f json -o bandit-report.json || true

    - name: Check Bytecode Compilation
      run: |
        python -m py_compile api/main.py
        python -m py_compile analyst_dashboard/analyzers/gem_screener.py
        python -m py_compile analyst_dashboard/analyzers/optimal_execution.py
        python -m py_compile analyst_dashboard/analyzers/confluence_engine.py
        python -m py_compile scripts/ingest_alpaca_historical.py
        python -m py_compile scripts/apply_registration_plan_wrapper.py
        python -m py_compile tools/governance/validate_backlog_integrity.py
        python -m py_compile tests/test_backlog_integrity_validator.py

  build_and_export:
    name: Static SSG Export & Integrity Gate
    runs-on: ubuntu-latest
    needs: [test, lint_and_security]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: frontend
      run: npm ci

    - name: Run Frontend Architectural & Invariant Tests
      working-directory: frontend
      run: npm run test:arch

    - name: Enforce ARX UX Design Parity Gate V1 (Structural Invariants)
      working-directory: frontend
      run: npm run test:parity

    - name: Enforce Opportunity Dossier Snapshot Integrity Gate
      working-directory: frontend
      run: npm run check:dossier

    - name: Compile Static SSG Routes (145 Pages)
      working-directory: frontend
      run: npm run build:verified

    - name: Verify Static Export Integrity
      working-directory: frontend
      run: |
        test -d out && echo "✅ Static build directory exists"
        test -f out/index.html && echo "✅ Terminal SSR shell verified"

    - name: Enforce Data Integrity Policy
      run: |
        FOUND=$(grep -rn "_generate_sample" --include="*.py" analyst_dashboard/ api/ engines/ analysis/ utils/ --exclude-dir=tests 2>/dev/null || true)
        if [ -n "$FOUND" ]; then
          echo "ERROR: Rogue sample data generator found in production code:"
          echo "$FOUND"
          exit 1
        else
          echo "✅ Data integrity verified: Zero synthetic generation in production paths"
        fi

  pre_sprint5_certification:
    name: Pre-Sprint 5 Closure Certification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest

      - name: Execute Strict Pre-Sprint 5 Closure Certification
        id: p5_cert
        continue-on-error: true
        env:
          PYTHONPATH: "."
        run: |
          echo "============================================================"
          echo "ARX TERMINAL — PRE-SPRINT 5 CLOSURE CERTIFICATION GATE"
          echo "Scope: Enforces Invariants P5-001 to P5-012."
          echo "Current Expected State: FAIL CLOSED (exit code 1) until Product Owner"
          echo "                        authorizes kickoff and promotes production deployment."
          echo "============================================================"
          python tools/governance/validate_backlog_integrity.py --pre-sprint5-closure || {
            EXIT_CODE=$?
            echo "::notice title=Pre-Sprint 5 Certification Status::FAIL CLOSED (exit code $EXIT_CODE). Pre-Sprint 5 closure is NOT certified; Sprint 5 kickoff remains blocked."
            exit $EXIT_CODE
          }
