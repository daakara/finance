name: ARX Terminal CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-cov httpx starlette pyyaml pytest-asyncio

    - name: Run Tier 1 Core Invariant Gate
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/ -m tier1 -v

    - name: Run Tier 2 Path-Filtered Gates (Temporary All-Run)
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/ -m "tier2a or tier2b or tier2c" -v

    - name: Run Focused Fundamentals & Research Invariant Gate
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/test_fundamentals_api.py tests/test_sourced_fundamentals_pilot.py tests/test_generate_opportunity_dossier_snapshot.py -v

    - name: Verify Opportunity Dossier Snapshot Determinism
      env:
        PYTHONPATH: "."
      run: |
        python scripts/research/generate_opportunity_dossier_snapshot.py --check

    - name: Run Historical SIP Ingestion & Registration Expansion Suite
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/test_bounded_150_candidate_expansion.py \
               tests/test_identity_adoption_dry_run.py \
               tests/test_identity_persistence.py \
               tests/test_three_candidate_registration_plan.py \
               tests/test_registration_execution_wrapper.py \
               tests/test_alpaca_historical_sip_ingestion.py \
               tests/test_market_db.py \
               tests/test_market_evidence_f13a.py -v

    - name: Run Sprint 2 Package B Recovery and Admission Safety Gate
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/test_pilot_identity_and_guarded_recovery.py \
               tests/test_universe_admission_mappings.py \
               tests/test_package_b_deployment_rehearsal.py -v

    - name: Run Sprint 2 Package C Canonical Contract & Governance Gate
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/test_package_b_v3_canonical_consumer.py \
               tests/test_strategy_governance_adversarial.py \
               tests/test_lookback_threshold_boundaries.py -v

    - name: Run Tier 3 Pre-Flight Release Gate
      if: github.base_ref == 'main' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/ -m tier3 -v

  lint_and_security:
    name: Code Quality & Security Linter
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install linting & security tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 bandit

    - name: Enforce Syntax & Critical AST Checks
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Bandit Security Analysis
      run: |
        bandit -r api/ analyst_dashboard/ -ll -s B101 -f json -o bandit-report.json || true

    - name: Check Bytecode Compilation
      run: |
        python -m py_compile api/main.py
        python -m py_compile analyst_dashboard/analyzers/gem_screener.py
        python -m py_compile analyst_dashboard/analyzers/optimal_execution.py
        python -m py_compile analyst_dashboard/analyzers/confluence_engine.py
        python -m py_compile scripts/ingest_alpaca_historical.py
        python -m py_compile scripts/apply_registration_plan_wrapper.py

  build_and_export:
    name: Static SSG Export & Integrity Gate
    runs-on: ubuntu-latest
    needs: [test, lint_and_security]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: frontend
      run: npm ci

    - name: Run Frontend Architectural & Invariant Tests
      working-directory: frontend
      run: npm run test:arch

    - name: Enforce Opportunity Dossier Snapshot Integrity Gate
      working-directory: frontend
      run: npm run check:dossier

    - name: Compile Static SSG Routes (145 Pages)
      working-directory: frontend
      run: npm run build:verified

    - name: Verify Static Export Integrity
      working-directory: frontend
      run: |
        test -d out && echo "✅ Static build directory exists"
        test -f out/index.html && echo "✅ Terminal SSR shell verified"

    - name: Enforce Data Integrity Policy
      run: |
        FOUND=$(grep -rn "_generate_sample" --include="*.py" analyst_dashboard/ api/ engines/ analysis/ utils/ --exclude-dir=tests 2>/dev/null || true)
        if [ -n "$FOUND" ]; then
          echo "ERROR: Rogue sample data generator found in production code:"
          echo "$FOUND"
          exit 1
        else
          echo "✅ Data integrity verified: Zero synthetic generation in production paths"
        fi

  deploy_and_purge_cache:
    name: Production Deployment & Edge Cache Invalidation
    runs-on: ubuntu-latest
    needs: [build_and_export]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Warm Up Render Backend
      run: |
        echo "Pinging Render backend API health endpoint..."
        curl -s -X POST "https://finance-backend-api-qis0.onrender.com/api/v1/cache/clear" || echo "Backend warming up..."

    - name: Invalidate Cloudflare CDN Edge Cache
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      run: |
        if [ -n "$CLOUDFLARE_ZONE_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
          echo "Purging Cloudflare Edge Cache..."
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}'
          echo "✅ Cloudflare edge cache purged successfully."
        else
          echo "Cloudflare zone purge skipped (Pages automatically serves updated SSG assets)."
        fi
