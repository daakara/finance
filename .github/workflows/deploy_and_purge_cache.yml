name: Production CI/CD & Automated Cache Purge

on:
  push:
    branches:
      - main

jobs:
  test_and_purge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx starlette

      - name: Run Test Suite
        env:
          PYTHONPATH: "."
        run: |
          pytest tests/ -v

      - name: Purge Backend Runtime & Disk Cache
        run: |
          echo "Calling Render backend cache-clear endpoint..."
          curl -s -X POST "https://finance-backend-api-qis0.onrender.com/api/v1/cache/clear" || echo "Backend warming up..."

      - name: Purge Cloudflare Edge & CDN Cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -n "$CLOUDFLARE_ZONE_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Purging Cloudflare Edge Cache..."
            curl -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"purge_everything":true}'
          else
            echo "Cloudflare zone purge skipped (Pages automatically purges assets on new build)."
          fi