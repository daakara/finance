name: Release Qualification Suite

on:
  pull_request:
    branches: [ release/production, main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release_qualification:
    name: ARX Release Qualification (RQ-01..12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov httpx pyyaml jsonschema

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      # RQ-01: Candidate Identity & Lineage
      - name: "[RQ-01] Verify Candidate Identity & Ancestry"
        run: python scripts/release/rq01_candidate_identity.py --allow-main-target

      # RQ-02: Release Diff Integrity
      - name: "[RQ-02] Verify Release Diff Integrity"
        run: python scripts/release/rq02_diff_integrity.py --allow-ci-workflow

      # RQ-03: Backend Regression Suite
      - name: "[RQ-03] Run Backend Regression Suite"
        run: python -m pytest tests/test_directive_057_remediation.py tests/test_confluence_engine.py -v

      # RQ-04: Frontend Regression & Typecheck
      - name: "[RQ-04] Run Frontend Regression & Typecheck"
        working-directory: ./frontend
        run: |
          npm run type-check
          npm run test:sizing

      # RQ-05: Cross-Engine Invariants
      - name: "[RQ-05] Verify Cross-Engine Invariants"
        run: python scripts/release/rq05_cross_engine_invariants.py

      # RQ-06: Governance Invariants
      - name: "[RQ-06] Verify Canonical Backlog Integrity"
        run: python tools/governance/validate_backlog_integrity.py

      # RQ-07: Deployment Safety & Secret Isolation
      - name: "[RQ-07] Verify Deployment Safety & Secret Isolation"
        run: python scripts/release/rq07_deployment_safety.py

      # RQ-08: Artifact Provenance & Digest Binding
      - name: "[RQ-08] Generate Cryptographic Artifact Provenance"
        run: python scripts/release/rq08_artifact_provenance.py

      # RQ-09: Four-Way Compatibility Suite
      - name: "[RQ-09] Execute Four-Way Cross-Platform Compatibility Suite"
        run: python scripts/release/rq09_compatibility_suite.py

      # RQ-10: Configuration & Environment Contract Integrity
      - name: "[RQ-10] Verify Release Configuration Integrity"
        run: python scripts/release/rq10_config_integrity.py

      # RQ-11: Rollback Readiness & Target Verification
      - name: "[RQ-11] Verify Rollback Readiness & Snapshot Anchors"
        run: python scripts/release/rq11_rollback_readiness.py

      # RQ-12: Final Qualification Summary Aggregation
      - name: "[RQ-12] Compile Release Qualification Summary"
        run: python scripts/release/rq12_qualification_summary.py

      - name: Upload Qualification Receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-qualification-receipts
          path: scripts/release/*.json
