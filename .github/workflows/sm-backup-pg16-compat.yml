name: Smart Money PG16 Backup Compatibility (Issue 265)

on:
  pull_request:
    paths:
      - "Dockerfile.smart-money-backup"
      - "analyst_dashboard/smart_money/storage/backup/pg_client_compat.py"
      - "analyst_dashboard/smart_money/storage/backup/backup_engine.py"
      - "tests/test_sm_act_020_pg_client_compat.py"
      - ".github/workflows/sm-backup-pg16-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-contract:
    name: PG16 fail-closed compatibility regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install requirements and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run targeted synthetic tests
        run: python -m pytest tests/test_sm_act_020_pg_client_compat.py -q

  backup-image:
    name: Official PG16 backup image build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated backup image (no deployment)
        run: docker build -f Dockerfile.smart-money-backup -t arx-backup-pg16:ci .
      - name: Verify official client tools in image
        run: |
          docker run --rm --entrypoint pg_dump arx-backup-pg16:ci --version | grep -E '^pg_dump \(PostgreSQL\) 16\.'
          docker run --rm --entrypoint pg_restore arx-backup-pg16:ci --version | grep -E '^pg_restore \(PostgreSQL\) 16\.'
